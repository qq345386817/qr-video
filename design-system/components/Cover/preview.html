<!-- @dsCard height=288 -->
<div style="width:960px;height:288px;position:relative;background:var(--bg);color:var(--ink);font-family:var(--font-sans);overflow:hidden">
<svg viewBox="0 0 960 96" style="width:960px;height:96px;display:block" aria-hidden="true">
<!--
Color blocks: brand 384x96, tint 288x96, warm 192x96, ink 96x96.
Arrangement: one horizontal band; the long product name sits below the band.
Pattern: modular QR-like tiles reflect text encoded into QR video, not a new logo.
Scale: space-2 (8px), space-4 (16px), space-8 (32px); radius-sm (12px).
-->
<style>.b{fill:var(--brand)}.t{fill:var(--tint)}.w{fill:var(--warm)}.i{fill:var(--ink)}.p{fill:var(--on-brand)}.r{rx:var(--radius-sm)}</style>

<rect class="p r" x="32" y="16" width="64" height="64"/><rect class="b r" x="48" y="32" width="32" height="32"/>
<rect class="p r" x="112" y="16" width="32" height="32"/><rect class="p r" x="160" y="48" width="32" height="32"/><rect class="p r" x="208" y="16" width="64" height="32"/><rect class="p r" x="288" y="48" width="64" height="32"/>
<rect class="b r" x="416" y="16" width="64" height="64"/><rect class="t r" x="432" y="32" width="32" height="32"/>
<rect class="b r" x="496" y="16" width="32" height="32"/><rect class="b r" x="544" y="48" width="32" height="32"/><rect class="b r" x="592" y="16" width="48" height="64"/>

<rect class="t r" x="888" y="24" width="48" height="48"/>
</svg>
<h1 style="margin:32px 32px 8px;font-size:58px;line-height:1;font-weight:700;letter-spacing:-2px;color:var(--ink)">Secret Video Message</h1>
<p style="margin:0 32px;font-size:14px;line-height:1.6;color:var(--muted)">Small words. A little anticipation. A real message.</p>
</div>
